<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firebase Todo List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Todo List</h1>

      <form id="todo-form" class="todo-form">
        <label for="todo-input" class="sr-only">New todo</label>
        <input id="todo-input" name="todo" type="text" placeholder="Add a task..." required />
        <button type="submit">Add</button>
      </form>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-state" class="empty-state">No todos yet. Add one above.</p>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
